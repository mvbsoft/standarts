# agent-hooks template 1.1.0 — a starting point: this project's lines (standard AI-05, AI-06).
# Read by check-file.sh and check-command.sh, which the hooks post-edit.sh and pre-bash.sh run; all
# are verbatim. One setting per line; # starts a comment.
#
# check <.ext or file name>[,…] <command>
#   After an Edit or Write of a matching file, check-file.sh runs <command> "<the file>" in the dev
#   container. Every matching line runs, in order: the formatter in its check mode, the linter and,
#   where the tool can check one file, the type checker (QLT-01). Never a command that rewrites the
#   file. The same tools and versions as the gates, so a clean file stays clean in make gates.
# block <tool>…
#   More host tools for check-command.sh to block, beyond its built-in list.
# allow <tool>…
#   Host tools check-command.sh lets through: only the project's host exceptions in registry
#   section E.
#
# Python:
#   check .py,.pyi ruff format --check --diff
#   check .py,.pyi ruff check
#   check .py,.pyi pyright
# TypeScript:
#   check .ts,.tsx,.mts,.cts,.js,.jsx,.mjs,.cjs prettier --check
#   check .ts,.tsx,.mts,.cts,.js,.jsx,.mjs,.cjs eslint --max-warnings 0
# PHP:
#   check .php php-cs-fixer check --diff --show-progress=none
#   check .php phpstan analyse --no-progress --error-format=raw

<the lines of this project's languages>
